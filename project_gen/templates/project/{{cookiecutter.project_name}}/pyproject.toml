[tool.poetry]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = ""
authors = {{cookiecutter.authors.split(',')|replace("'",'"')}}
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
allure-pytest = "^2.15.0"
annotated-types = "^0.7.0"
assertpy = "^1.1"
backports-datetime-fromisoformat = "^2.0.3"
bcrypt = "^5.0.0"
certifi = "^2025.11.12"
cffi = "^2.0.0"
cryptography = "^46.0.3"
decorator = "^5.2.1"
deprecated = "^1.3.1"
distconfig3 = "^1.0.1"
environs = "^14.5.0"
exceptiongroup = "^1.3.1"
fabric = "^3.2.2"
faker = "^38.2.0"
fake = "^0.8"
pi = "^0.1.2"
pydantic-core = "^2.41.5"
pydentic = "^0.0.1.dev3"
pyhamcrest = "^2.1.0"
pynacl = "^1.6.1"
pytest = "^9.0.1"
pytest-order = "^1.3.0"
pytest-telegram-notifier = "^1.4.0"
pyyaml = "^6.0.3"
six = "^1.17.0"
structlog = "^25.5.0"
telegram-notifier = "^0.3"
toml = "^0.10.2"
watchdog = "^6.0.0"
swagger-coverage = {url = "https://github.com/Morrhat/swagger-coverage-py/archive/refs/heads/master.zip"}
httpx = "^0.28.1"
curlify2 = "^2.0.0"
pytest-asyncio = "^1.3.0"
ruff = "==0.14.7"
telebot = "^0.0.5"
telegram = "^0.0.1"
pytelegrambotapi = "^4.29.1"
vyper-config = "^1.2.1"
pathlib = "^1.0.1"
restcodegen = "1.2.0"
pydantic = "^2.12.5"
aiohttp = "^3.11.14"
aiohttp-retry = "^2.9.1"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^1.3.0"


[tool.poetry.group.lint.dependencies]
ruff = "^0.14.7"
mypy = "^1.19.0"
types-requests = "^2.32.4.20250913"

[tool.ruff]
line-length = 120
extend-exclude = ['requirements.txt']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = """
    --telegram-notifier
    --alluredir=../allure-results
    --telegram-notifier-config-file=telegram-notifier-config.ini
"""
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'